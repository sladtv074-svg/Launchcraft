
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launchcraft</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #191919;
      color: white;
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background: #111111;
      padding: 25px 15px;
      border-right: 1px solid #333;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 40px;
      color: #55d66b;
    }

    .nav-button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      background: transparent;
      border: none;
      color: #aaa;
      text-align: left;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .nav-button:hover,
    .nav-button.active {
      background: #292929;
      color: white;
    }

    .main {
      flex: 1;
      padding: 35px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 30px;
    }

    .profile {
      background: #292929;
      padding: 10px 18px;
      border-radius: 6px;
      color: #bbb;
    }

    .hero {
      background: linear-gradient(135deg, #25452b, #172b1b);
      border-radius: 12px;
      padding: 45px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 25px;
    }

    .hero h2 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #c5c5c5;
      margin-bottom: 25px;
    }

    .play-button {
      background: #55d66b;
      color: #102016;
      border: none;
      padding: 16px 35px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: fit-content;
    }

    .play-button:hover {
      background: #72ed87;
    }

    .bottom {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: #242424;
      border-radius: 10px;
      padding: 25px;
      flex: 1;
      min-width: 220px;
    }

    .card h3 {
      margin-bottom: 12px;
    }

    .card p {
      color: #aaa;
      margin-bottom: 15px;
    }

    select {
      background: #333;
      color: white;
      padding: 10px;
      border: 1px solid #555;
      border-radius: 5px;
      width: 100%;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 75px;
      }

      .logo {
        font-size: 0;
      }

      .logo::after {
        content: "L";
        font-size: 25px;
      }

      .main {
        padding: 20px;
      }

      .hero {
        padding: 25px;
      }

      .hero h2 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="logo">LAUNCHCRAFT</div>

    <button class="nav-button active">⌂ Accueil</button>
    <button class="nav-button">⛏ Java Edition</button>
    <button class="nav-button">▣ Installations</button>
    <button class="nav-button">⚙ Paramètres</button>
  </aside>

  <main class="main">

    <div class="header">
      <h1>Bienvenue sur Launchcraft</h1>
      <div class="profile">Joueur invité</div>
    </div>

    <section class="hero">
      <h2>Prêt à jouer ?</h2>
      <p>Ton aventure Minecraft commence ici.</p>
      <button class="play-button" onclick="playGame()">
        ▶ JOUER
      </button>
    </section>

    <div class="bottom">

      <div class="card">
        <h3>Version Minecraft</h3>
        <p>Choisis ta version préférée.</p>

        <select id="version">
          <option>1.21.1</option>
          <option>1.20.1</option>
          <option>1.19.4</option>
          <option>1.16.5</option>
          <option>1.12.2</option>
          <option>1.8.9</option>
        </select>
      </div>

      <div class="card">
        <h3>Modloader</h3>
        <p>Choisis ton environnement.</p>

        <select id="loader">
          <option>Vanilla</option>
          <option>Fabric</option>
          <option>Forge</option>
          <option>NeoForge</option>
        </select>
      </div>

    </div>

  </main>

  <script>
    function playGame() {
      const version = document.getElementById("version").value;
      const loader = document.getElementById("loader").value;

      alert(
        "Lancement demandé !\nVersion : " +
        version +
        "\nModloader : " +
        loader +
        "\n\nLe moteur Minecraft sera intégré prochainement."
      );
    }
  </script>

</body>
</html>
